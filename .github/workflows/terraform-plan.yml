name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive

  validate:
    name: Terraform Validate
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
      fail-fast: false
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == matrix.environment
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init (no backend)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  security_scan:
    name: Terraform Security Scan
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
      fail-fast: false
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == matrix.environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: environments/${{ matrix.environment }}
          soft_fail: false

  plan:
    name: Terraform Plan
    needs: [validate, security_scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
      fail-fast: false
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == matrix.environment
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET || 'crickethub-us-east-1-terraform-state' }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -no-color -lock=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/terraform.tfplan
          if-no-files-found: ignore
