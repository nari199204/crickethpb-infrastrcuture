name: Terraform Bootstrap State Bucket

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        required: true
        default: us-east-1
      bucket_name:
        description: S3 bucket name for remote state
        required: true
        default: crickethub-us-east-1-terraform-state

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ github.event.inputs.region }}
      AWS_DEFAULT_REGION: ${{ github.event.inputs.region }}
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Bootstrap S3 state bucket
        working-directory: bootstrap/s3-state
        run: |
          terraform init
          terraform plan \
            -var="region=${{ github.event.inputs.region }}" \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}"
          terraform apply -auto-approve \
            -var="region=${{ github.event.inputs.region }}" \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}"
